  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .video-page {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 2;
      pointer-events: none;
    }

    .main-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      object-fit: contain;
      z-index: 3;
      cursor: pointer;
    }

    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 35px;
      color: #fff;
      font-size: 18px;
      z-index: 5;
      pointer-events: none;
    }

    .top-bar span {
      padding: 10px 20px;
      border-radius: 25px;
      background: rgba(0, 0, 0, 0.55);
    }

    .watch-button {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      border: none;
      border-radius: 50%;
      padding: 0;
      background: #4fc3f7;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      z-index: 6;
      transition: transform 0.2s ease,
                  box-shadow 0.2s ease;
    }

    .watch-button:hover {
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.5);
    }

    .watch-button::after {
      content: "";
      width: 0;
      height: 0;
      margin-left: 8px;
      border-top: 25px solid transparent;
      border-bottom: 25px solid transparent;
      border-left: 36px solid #fff;
    }

    .watch-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px;
    }

    .progress {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
      z-index: 7;
      pointer-events: none;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: #ff0000;
      transition: width 0.15s linear;
    }

    @media (max-width: 600px) {
      .top-bar {
        padding: 20px 25px;
        font-size: 16px;
      }

      .top-bar span {
        padding: 8px 16px;
      }

      .watch-button {
        width: 90px;
        height: 90px;
      }

      .watch-button::after {
        border-top-width: 20px;
        border-bottom-width: 20px;
        border-left-width: 30px;
      }

      .progress {
        height: 5px;
      }
    }
  </style>

<body>

      >
    </a>
  </noscript>
  <!-- END HISTATS COUNTER -->

  <main class="video-page">

    <!-- BACKGROUND PHOTO: URL DIATUR DI ATAS -->
    <img
      id="backgroundImage"
      class="background"
      alt=""
    >

    <div class="overlay"></div>

    <!-- VIDEO: URL DIATUR DI ATAS -->
    <video
      id="mainVideo"
      class="main-video"
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
    >
      Your browser does not support HTML5 video.
    </video>

    <div class="top-bar">
      <span>Video</span>
      <span>Watch</span>
    </div>

    <button
      type="button"
      id="watchButton"
      class="watch-button"
      aria-label="Play video"
      title="Play video"
    ></button>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

  </main>

  <!-- VIDEO PLAYER SCRIPT -->
  <script>
    (function() {
      const video = document.getElementById('mainVideo');
      const button = document.getElementById('watchButton');
      const progressBar = document.getElementById('progressBar');
      const background = document.getElementById('backgroundImage');

      // Ambil semua link dari konfigurasi di bagian atas
      background.src = PAGE_CONFIG.background;
      video.poster = PAGE_CONFIG.poster;

      const source = document.createElement('source');
      source.src = PAGE_CONFIG.video;
      source.type = 'video/mp4';
      video.appendChild(source);

      video.load();

      // Coba autoplay tanpa suara
      video.play().catch(function() {
        button.style.display = 'flex';
      });

      // Tombol Play
      button.addEventListener('click', async function() {
        try {
          video.muted = false;
          await video.play();
          button.style.display = 'none';
        } catch (error) {
          try {
            video.muted = true;
            await video.play();
            button.style.display = 'none';
          } catch (playError) {
            button.style.display = 'flex';
            console.error('Unable to play video:', playError);
          }
        }
      });

      // Klik video untuk pause / play
      video.addEventListener('click', async function() {
        if (video.paused) {
          try {
            await video.play();
            button.style.display = 'none';
          } catch (error) {
            button.style.display = 'flex';
          }
        } else {
          video.pause();
          button.style.display = 'flex';
        }
      });

      // Progress bar
      video.addEventListener('timeupdate', function() {
        if (video.duration && isFinite(video.duration)) {
          const percentage =
            (video.currentTime / video.duration) * 100;

          progressBar.style.width = percentage + '%';
        }
      });

      // Video berakhir
      video.addEventListener('ended', function() {
        button.style.display = 'flex';
        progressBar.style.width = '0%';
      });

      // Jika video gagal dimuat
      video.addEventListener('error', function() {
        button.style.display = 'flex';
        console.error('Video failed to load.');
      });
    })();
  </script>
